name: Manual public F-Droid source check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted F-Droid source without publication
        run: python3 scripts/check-public-fdroid.py
