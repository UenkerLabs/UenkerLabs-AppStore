name: Manual F-Droid Pages deployment and verification
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: uenkerlabs-pages-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v4
      - name: Checkout reviewed public website and signed repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Refuse publication of legacy signed F-Droid address after GitHub rename
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = 'https://uenkerlabs.github.io/UenkerLabs-AppStore/repo'
          v1 = json.loads(Path('site/repo/index-v1.json').read_text())
          v2 = json.loads(Path('site/repo/index-v2.json').read_text())
          addresses = [v1['repo']['address'].rstrip('/'), v2['repo']['address'].rstrip('/')]
          if addresses != [expected, expected]:
              raise SystemExit(
                  'STOP: F-Droid v1/v2 still contain the old signed Pages URL. '
                  'Verify the actual new hosting URL and rebuild/re-sign with the '
                  'existing repository key before publishing. Existing APKs must not be re-signed.'
              )
          print('Signed repository address matches expected GitHub Pages host')
          PY
      - name: Validate active beta APKs, signed indices and pinned app signer
        shell: bash
        run: |
          set -euo pipefail
          test -f site/.nojekyll
          test -f site/index.html
          test -f site/repo/index.html
          test -f site/repo/index-v1.jar
          test -f site/repo/entry.jar
          python3 scripts/check-public-fdroid.py --repo-dir site/repo
          python3 - <<'PY'
          import hashlib,json,pathlib
          repo=pathlib.Path('site/repo')
          entry=json.loads((repo/'entry.json').read_text())
          v2=(repo/'index-v2.json').read_bytes()
          assert len(v2)==entry['index']['size'], 'v2 size mismatch'
          assert hashlib.sha256(v2).hexdigest()==entry['index']['sha256'], 'v2 digest mismatch'
          index=json.loads(v2)
          icon=index['repo']['icon']['en-US']
          icon_bytes=(repo/icon['name'].lstrip('/')).read_bytes()
          assert len(icon_bytes)==icon['size'], 'icon size mismatch'
          assert hashlib.sha256(icon_bytes).hexdigest()==icon['sha256'], 'icon digest mismatch'
          assert index['repo']['address']=='https://yzue1980.github.io/UenkerLabs-AppStore/repo'
          print('Local index and icon hashes verified; package count',len(index.get('packages',{})))
          PY
          for signed in entry index-v1; do
            jarsigner -verify -verbose -certs "site/repo/$signed.jar" > "/tmp/$signed-verification.txt"
            if ! grep -qi 'jar verified' "/tmp/$signed-verification.txt"; then exit 1; fi
            keytool -printcert -jarfile "site/repo/$signed.jar" | grep -i 'SHA256' | tr -d ': ' | grep -qi '1A25F39551B1615980705043AD003D9F3258A8E96E91539DDB0D89ABFCD3B0F8'
          done
      - name: Review public website content and download links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('site')
          page=(root/'index.html').read_text(encoding='utf-8')
          details=(root/'repo/index.html').read_text(encoding='utf-8')
          css=(root/'assets/style.css').read_text(encoding='utf-8')
          assert '<html lang="de">' in page, 'Homepage locale must be German'
          assert page.count('class="app-card"')==3, 'Must show three beta app cards'
          assert 'Apps are on the way' not in page, 'Old empty catalog must be removed'
          assert 'fonts.googleapis.com' not in css, 'Avoid third-party font requests'
          assert 'UenkerLabs' in page and 'F-Droid' in page
          for app, version in {'calendar':'0.2.0','alarm':'0.1.0','arcade':'0.1.0'}.items():
              filename='UenkerLabs-'+app+'-beta-'+version+'.apk'
              assert filename in page and filename in details, filename
              assert (root/'repo'/filename).exists(), filename
          for removed in ('phone','messages'):
              assert not (root/'repo'/('UenkerLabs-'+removed+'-beta-0.1.0.apk')).exists()
          print('PASS: Three public app cards and updated APK links')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload reviewed, static gh-pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy existing signed repository
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Validate public HTTPS and signatures after deployment
        run: python3 scripts/check-public-fdroid.py
      - name: Check public homepage and source landing after publication
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          pages={
            'https://yzue1980.github.io/UenkerLabs-AppStore/?edition=20261111':'class="app-card"',
            'https://yzue1980.github.io/UenkerLabs-AppStore/repo/?edition=20261111':'Drei Beta-Apps'
          }
          for url,marker in pages.items():
              with urlopen(Request(url,headers={'User-Agent':'UenkerLabs-Site-QA/1.0','Cache-Control':'no-cache'}),timeout=25) as response:
                  assert response.status==200, (url,response.status)
                  html=response.read().decode('utf-8')
              assert marker in html, (url,'Public site served outdated HTML')
          print('PASS: Public homepage and F-Droid source landing on GitHub Pages')
          PY
