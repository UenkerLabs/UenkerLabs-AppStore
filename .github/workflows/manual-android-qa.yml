name: Manual Android QA build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-android-qa.yml'
    inputs:
      module:
        description: "Build all five prototypes (selection kept for UI compatibility)"
        required: true
        default: arcade
        type: choice
        options:
          - arcade
          - calendar
          - messages
          - phone
          - alarm
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using preinstalled runner SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDK_MANAGER" || { echo "sdkmanager missing inside $ANDROID_HOME"; exit 1; }
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Source hygiene and pure Java smoke tests
        run: bash scripts/check-source.sh
      - name: Build all five debug APKs without publishing
        working-directory: android
        run: gradle :calendar:assembleDebug :messages:assembleDebug :phone:assembleDebug :alarm:assembleDebug :arcade:assembleDebug --no-daemon --console=plain --continue
      - name: Upload review-only APK
        uses: actions/upload-artifact@v4
        with:
          name: "five-android-prototype-debug-apks"
          path: "android/*/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 3
