name: Manual Android QA build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-android-qa.yml'
    inputs:
      module:
        description: "Which Android app should be built?"
        required: true
        default: arcade
        type: choice
        options:
          - arcade
          - calendar
          - messages
          - phone
          - alarm
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Source hygiene and pure Java smoke tests
        run: bash scripts/check-source.sh
      - name: Build debug APK without publishing
        working-directory: android
        run: gradle :${{ inputs.module || 'arcade' }}:assembleDebug --no-daemon --console=plain
      - name: Upload review-only APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.module || 'arcade' }}-debug-review"
          path: "android/${{ inputs.module || 'arcade' }}/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 3
